name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / type / test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --all-groups --frozen
      - name: ruff
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy
      - name: pytest (coverage)
        run: uv run pytest -q --cov=agentd --cov-report=term

  web:
    name: console typecheck / test / build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Unit tests
        working-directory: web
        run: npm run test
      - name: Build
        working-directory: web
        run: npm run build
      # 体积预算进 CI：脚本超预算 exit 1，防止「文档写着 <250KB、实际早已超了」再次发生
      - name: Bundle budget
        working-directory: web
        run: npm run size

  smoke:
    name: console e2e smoke (demo mode)
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build (preview serves dist)
        working-directory: web
        run: npm run build
      - name: Playwright browsers
        working-directory: web
        run: npx playwright install chromium --with-deps
      - name: Smoke tests
        working-directory: web
        run: npx playwright test

  image:
    name: docker build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: agentd:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # tag（v*）时推送镜像：需要仓库 secrets 里的 registry 凭据，M5 再启用
  # publish:
  #   if: startsWith(github.ref, 'refs/tags/v')
  #   ...
