[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agentd"
version = "0.1.0"
description = "Self-hostable agent runtime: HTTP/SSE API + Python SDK"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "pytest-cov>=7.1.0",
  "agentd-client",
]

[project.scripts]
agentd = "agentd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentd"]

# sdist 白名单：仓库里还有 web/（node_modules 数千文件）、.agents/、var/ 等运行产物，
# 默认「整仓打包」会让 sdist 膨胀到 30MB+ 且把无关工具链带给下游。只打包可构建的最小集。
[tool.hatch.build.targets.sdist]
include = [
  "src/agentd",
  "tests",
  "sdk/agentd_client",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "uv.lock",
]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
  "**/.pytest_cache",
  "**/.mypy_cache",
  "**/.ruff_cache",
]

[tool.uv.workspace]
members = ["sdk/agentd_client"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "sdk"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = [
  "B008",   # FastAPI 的 Depends()/Query() 默认值是框架惯用法
  "RUF001", # 中文注释/文案里的全角标点不是歧义字符
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "sdk"]
mypy_path = "src"
strict = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:agentd.*"]

[tool.coverage.run]
source = ["agentd"]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.uv.sources]
agentd-client = { workspace = true }
