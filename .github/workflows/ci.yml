name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / type / test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --all-groups --frozen
      - name: ruff
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest -q

  image:
    name: docker build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: agentd:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # tag（v*）时推送镜像：需要仓库 secrets 里的 registry 凭据，M5 再启用
  # publish:
  #   if: startsWith(github.ref, 'refs/tags/v')
  #   ...
