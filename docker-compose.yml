services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      # 网络受限时在 .env 里覆盖成镜像源，无需改 daemon.json
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.16}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: agentd:${AGENTD_IMAGE_TAG:-dev}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AGENTD_ENV: prod
      AGENTD_HOST: 0.0.0.0
      AGENTD_PORT: "8000"
      AGENTD_DATA_DIR: /data
    volumes:
      - agentd-data:/data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;assert urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      AGENTD_DOMAIN: ${AGENTD_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  agentd-data:
  caddy-data:
  caddy-config:
