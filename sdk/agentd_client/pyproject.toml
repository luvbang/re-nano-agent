[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agentd-client"
version = "0.1.0"
description = "Python SDK for the agentd platform (HTTP/SSE API)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentd_client"]
